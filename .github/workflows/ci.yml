name: SandGuard CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: sandguard
          POSTGRES_PASSWORD: sandguard_secret_pass
          POSTGRES_DB: sandguard_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gdal-bin libgdal-dev libgeos-dev libproj-dev proj-bin libpq-dev

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt

    - name: Run Pytest Suite
      env:
        DATABASE_URL: postgresql+asyncpg://sandguard:sandguard_secret_pass@localhost:5432/sandguard_db
        SYNC_DATABASE_URL: postgresql://sandguard:sandguard_secret_pass@localhost:5432/sandguard_db
        SECRET_KEY: test_secret_key_ci_pipeline_32chars
      run: |
        pytest backend/tests/unit
