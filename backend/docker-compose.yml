version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: sandguard_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sandguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sandguard_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-sandguard_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sandguard} -d ${POSTGRES_DB:-sandguard_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sandguard_redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sandguard_backend
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-sandguard}:${POSTGRES_PASSWORD:-sandguard_secret_pass}@db:5432/${POSTGRES_DB:-sandguard_db}
      - SYNC_DATABASE_URL=postgresql://${POSTGRES_USER:-sandguard}:${POSTGRES_PASSWORD:-sandguard_secret_pass}@db:5432/${POSTGRES_DB:-sandguard_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    volumes:
      - .:/app
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sandguard_celery_worker
    restart: always
    command: celery -A app.core.cel_app worker --loglevel=info -c 4
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-sandguard}:${POSTGRES_PASSWORD:-sandguard_secret_pass}@db:5432/${POSTGRES_DB:-sandguard_db}
      - SYNC_DATABASE_URL=postgresql://${POSTGRES_USER:-sandguard}:${POSTGRES_PASSWORD:-sandguard_secret_pass}@db:5432/${POSTGRES_DB:-sandguard_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    volumes:
      - .:/app
      - uploads_data:/app/uploads
    depends_on:
      backend:
        condition: service_started

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sandguard_celery_beat
    restart: always
    command: celery -A app.core.cel_app beat --loglevel=info
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    volumes:
      - .:/app
    depends_on:
      backend:
        condition: service_started

  flower:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sandguard_flower
    restart: always
    command: celery -A app.core.cel_app flower --port=5555
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  uploads_data:
